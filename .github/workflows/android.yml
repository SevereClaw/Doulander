name: Сборка Downloader для Android

# Запускается при изменениях в папке android/ и вручную
# (галочка «Выпустить релиз» — выложить APK во вкладку Releases)
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Выпустить релиз (APK во вкладке Releases)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml", "tests/android_selftest.sh"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # QuickJS — движок JavaScript для yt-dlp (без него YouTube отдаёт не все видео).
      # Собираем под телефоны сами и кладём как libqjsng.so — Android разрешает запускать
      # только программы из папки библиотек приложения.
      - name: Собрать QuickJS для Android
        run: |
          TAG=$(curl -s https://api.github.com/repos/quickjs-ng/quickjs/releases/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          echo "QuickJS-ng $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/quickjs-ng/quickjs.git qjs-src
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cmake -S qjs-src -B "qjs-$ABI" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI -DANDROID_PLATFORM=24 > /dev/null
            cmake --build "qjs-$ABI" -j4 --target qjs_exe > /dev/null || cmake --build "qjs-$ABI" -j4 > /dev/null
            BIN=$(find "qjs-$ABI" -maxdepth 2 -type f -name qjs | head -1)
            test -n "$BIN" || { echo "qjs не собрался для $ABI"; exit 1; }
            mkdir -p android/app/src/main/jniLibs/$ABI
            cp "$BIN" android/app/src/main/jniLibs/$ABI/libqjsng.so
            ls -la android/app/src/main/jniLibs/$ABI
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Собрать APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Разложить APK
        run: |
          mkdir -p apk
          for f in android/app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *arm64-v8a*) cp "$f" apk/Downloader-arm64.apk ;;
              *armeabi-v7a*) cp "$f" apk/Downloader-armv7.apk ;;
              *x86_64*) cp "$f" apk/Downloader-x86_64.apk ;;
            esac
          done
          ls -la apk

      # Проверка в эмуляторе Android: скачивание MP4, MKV и MP3 с тестового сервера
      - name: Включить KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Тестовое видео и сервер
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p testdata
          ffmpeg -loglevel error -f lavfi -i testsrc=duration=6:size=1280x720:rate=25 -f lavfi -i sine=frequency=440:duration=6 -c:v libx264 -c:a aac -shortest -y testdata/test.mp4
          nohup python3 tests/range_server.py testdata 8765 > server.log 2>&1 &

      - name: Автопроверка в эмуляторе
        id: selftest
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tests/android_selftest.sh apk/Downloader-x86_64.apk selftest

      - name: Отчёт самопроверки
        if: always()
        shell: pwsh
        run: ./tests/report.ps1 selftest/selftest.log "Самопроверка Android" $(if ("${{ steps.selftest.outcome }}" -eq "success") { 0 } else { 1 })

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Downloader-Android
          path: |
            apk/Downloader-arm64.apk
            apk/Downloader-armv7.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-selftest
          path: selftest/

      - name: Релиз
        if: inputs.release && steps.selftest.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          TAG="android-v$VER-${{ github.run_number }}"
          gh release create "$TAG" apk/Downloader-arm64.apk apk/Downloader-armv7.apk \
            --repo ${{ github.repository }} --latest=false \
            --title "Downloader для Android $VER (сборка ${{ github.run_number }})" \
            --notes "Скачайте **Downloader-arm64.apk** (подходит почти всем телефонам последних лет). Для старых 32-битных телефонов — Downloader-armv7.apk. Начиная с 1.1.0 приложение обновляется само (⚙ Настройки → Обновления приложения)."

      - name: Снимки экрана в ветку screenshots-android
        if: always()
        continue-on-error: true
        run: |
          ls selftest/*.png || exit 0
          tmp=$RUNNER_TEMP/shots; mkdir -p $tmp; cp selftest/*.png $tmp/
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan screenshots-android
          git rm -rfq . ; git clean -fdq -e selftest -e apk
          cp $tmp/*.png .
          git add *.png && git commit -qm "Снимки Android ${{ github.run_number }}" && git push -f origin screenshots-android
