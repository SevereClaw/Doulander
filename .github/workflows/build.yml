name: Сборка Downloader

# Запускается:
#  - вручную: вкладка Actions → "Сборка Downloader" → Run workflow
#    (галочка «Выпустить релиз» — выложить установщик во вкладку Releases)
#  - при пуше тега вида v1.0.1 — тоже создаётся Release
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Выпустить релиз (установщик во вкладке Releases)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить библиотеки
        run: pip install customtkinter pillow tkinterdnd2 pystray pysocks pyinstaller

      - name: Вписать номер сборки
        shell: pwsh
        run: |
          (Get-Content downloader.py -Encoding utf8) -replace '^BUILD_ID = 0\b', "BUILD_ID = ${{ github.run_id }}" |
            Set-Content downloader.py -Encoding utf8
          Select-String -Path downloader.py -Pattern '^BUILD_ID'

      - name: Собрать Downloader.exe
        run: pyinstaller --noconfirm --onefile --windowed --name Downloader --icon icon.ico --add-data "icon.ico;." --add-data "icon.png;." --add-data "sound.wav;." --collect-all tkinterdnd2 --hidden-import pystray._win32 --hidden-import socks --hidden-import sockshandler --collect-data customtkinter downloader.py

      - name: Скачать yt-dlp, ffmpeg и deno
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force Downloader | Out-Null
          Copy-Item dist/Downloader.exe, update.bat Downloader/
          New-Item -ItemType Directory -Force app | Out-Null
          Copy-Item dist/Downloader.exe, update.bat app/

          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile Downloader/yt-dlp.exe

          Invoke-WebRequest "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Get-ChildItem ffmpeg -Recurse -Include ffmpeg.exe, ffprobe.exe, ffplay.exe | Copy-Item -Destination Downloader/

          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath deno
          Copy-Item deno/deno.exe Downloader/

          Get-ChildItem Downloader
          Compress-Archive -Path Downloader -DestinationPath Downloader.zip

      # Проверка: программа открывается и качает тестовое видео в MP4, MKV, MP3 и FLAC,
      # а для музыки — квадратная обложка, выравнивание громкости и текст песни.
      # Если не прошла — сборка красная, и update.bat её не скачает.
      - name: Автопроверка программы
        shell: pwsh
        timeout-minutes: 10
        run: |
          New-Item -ItemType Directory -Force testdata | Out-Null
          Downloader/ffmpeg.exe -loglevel error -f lavfi -i testsrc=duration=6:size=1280x720:rate=25 -f lavfi -i sine=frequency=440:duration=6 -af volume=-12dB -c:v libx264 -c:a aac -shortest -y testdata/test.mp4
          Downloader/ffmpeg.exe -loglevel error -f lavfi -i testsrc=size=1280x720 -frames:v 1 -y testdata/thumb.jpg
          Copy-Item tests/clip.html, tests/lyrics.vtt testdata/
          $srv = Start-Process python -ArgumentList 'tests/range_server.py','testdata','8765' -PassThru -WindowStyle Hidden
          $prx = Start-Process python -ArgumentList 'tests/proxy_server.py','8899',"$PWD\proxy-hits.log" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $p = Start-Process Downloader/Downloader.exe -ArgumentList '--selftest','http://127.0.0.1:8765/test.mp4',"$PWD\selftest",'http://127.0.0.1:8765/clip.html','http://127.0.0.1:8899' -Wait -PassThru
          Stop-Process $srv, $prx -ErrorAction SilentlyContinue
          $hits = @(Get-Content proxy-hits.log -ErrorAction SilentlyContinue).Count
          Add-Content selftest/selftest.log "Запросов через тестовый прокси: $hits"
          $code = $p.ExitCode
          if ($hits -eq 0) { Add-Content selftest/selftest.log "FAIL прокси не использовался"; $code = 1 }
          # перезапуск программы самой собой (обновление, смена оформления):
          # старая копия сразу закрывается, новая должна запуститься
          Start-Process Downloader/Downloader.exe -ArgumentList '--spawn-test',"$PWD\spawn-ok.txt" -Wait
          for ($i = 0; $i -lt 20 -and -not (Test-Path spawn-ok.txt); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path spawn-ok.txt) { Add-Content selftest/selftest.log "OK   перезапуск программы самой собой" }
          else { Add-Content selftest/selftest.log "FAIL перезапуск: новая копия не запустилась"; $code = 1 }
          # одна копия программы: вторая копия должна сразу закрыться, передав окно первой
          # (запускаем из копии папки, чтобы настройки не попали в сборку)
          $inst = Join-Path $env:RUNNER_TEMP 'inst'
          Copy-Item Downloader $inst -Recurse -Force
          $first = Start-Process "$inst\Downloader.exe" -PassThru
          Start-Sleep -Seconds 10
          $second = Start-Process "$inst\Downloader.exe" -PassThru
          $quit = $second.WaitForExit(15000)
          $alive = -not $first.HasExited
          Get-Process Downloader -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($quit -and $alive) { Add-Content selftest/selftest.log "OK   вторая копия передала окно первой и закрылась" }
          else { Add-Content selftest/selftest.log "FAIL одна копия: вторая закрылась=$quit, первая работает=$alive"; $code = 1 }
          ./tests/report.ps1 selftest/selftest.log "Самопроверка" $code

      # YouTube иногда не пускает серверы GitHub, поэтому эта проверка только для информации.
      - name: Проверка YouTube (необязательная)
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 8
        run: |
          $p = Start-Process Downloader/Downloader.exe -ArgumentList '--selftest','https://www.youtube.com/watch?v=jNQXAC9IVRw',"$PWD\selftest-yt" -Wait -PassThru
          ./tests/report.ps1 selftest-yt/selftest.log "Проверка YouTube" $p.ExitCode

      - name: Собрать установщик
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $ver = (Select-String -Path downloader.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Установщик не собрался" }
          Get-Item dist-setup/DownloaderSetup.exe | Format-List Name, Length

      # Ставим программу «как пользователь», проверяем файлы, ярлык и запись в
      # «Установка и удаление программ», затем удаляем.
      - name: Проверить установщик
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process dist-setup/DownloaderSetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Downloader'
          $ok = $p.ExitCode -eq 0
          $report = @("Установка в $app : код $($p.ExitCode)")
          function Check($name, $cond) { $script:ok = $script:ok -and $cond; $script:report += "$(if ($cond) {'OK  '} else {'FAIL'}) $name" }
          foreach ($f in 'Downloader.exe','yt-dlp.exe','ffmpeg.exe','ffplay.exe','deno.exe','update.bat','unins000.exe') { Check $f (Test-Path (Join-Path $app $f)) }
          Check 'запись в «Установка и удаление программ»' (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F3C2A1E-5B7D-4E9A-9C1B-D0A1E2F3B4C5}_is1')
          Check 'ярлык в «Пуске»' (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Downloader.lnk'))
          Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $app 'Downloader.exe')); $i++) { Start-Sleep -Seconds 1 }
          Check 'удаление программы' (-not (Test-Path (Join-Path $app 'Downloader.exe')))
          $report | Set-Content setup-test.log -Encoding utf8
          ./tests/report.ps1 setup-test.log "Проверка установщика" $(if ($ok) { 0 } else { 1 })

      - name: Сохранить установщик
        uses: actions/upload-artifact@v5
        with:
          name: DownloaderSetup
          path: dist-setup/DownloaderSetup.exe

      - name: Сохранить полную сборку (вкладка Actions → Artifacts)
        uses: actions/upload-artifact@v5
        with:
          name: Downloader
          path: Downloader/

      - name: Сохранить только программу (для update.bat)
        uses: actions/upload-artifact@v5
        with:
          name: Downloader-app
          path: app/

      - name: Номер версии для релиза
        id: ver
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        shell: pwsh
        run: |
          $v = (Select-String -Path downloader.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Создать Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Downloader ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## Как установить
            1. Скачайте **DownloaderSetup.exe** ниже (раздел Assets).
            2. Запустите его — права администратора не нужны.
            3. Ярлык появится в «Пуске» (и на рабочем столе, если отметить).

            Windows может предупредить «Windows защитил ваш компьютер» — программа не подписана
            сертификатом. Нажмите «Подробнее» → «Выполнить в любом случае».

            Остальные файлы: `Downloader.zip` — то же без установки (распаковать и запустить),
            `Downloader.exe` и `update.bat` — для обновления уже установленной программы.
          files: |
            dist-setup/DownloaderSetup.exe
            Downloader.zip
            app/Downloader.exe
            app/update.bat
          generate_release_notes: true

      # Снимки окна в обоих оформлениях — в ветку screenshots (для проверки дизайна)
      - name: Снимки интерфейса
        if: always()
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 5
        run: |
          $srv = Start-Process python -ArgumentList 'tests/range_server.py','testdata','8765' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          New-Item -ItemType Directory -Force shots | Out-Null
          foreach ($style in 'phantom','classic','phantom-picker','phantom-flash') {
            Start-Process Downloader/Downloader.exe -ArgumentList '--screenshot',"$PWD\shots\$style.png",$style,'http://127.0.0.1:8765/clip.html','http://127.0.0.1:8765/test.mp4' -Wait
          }
          Start-Process Downloader/Downloader.exe -ArgumentList '--screenshot',"$PWD\shots\phantom-editor.png",'phantom-editor',"$PWD\testdata\test.mp4" -Wait
          Stop-Process $srv -ErrorAction SilentlyContinue
          Get-ChildItem shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP 'shots'
          Copy-Item shots $tmp -Recurse
          git checkout --orphan screenshots
          git rm -rf --quiet .
          Copy-Item "$tmp\*.png" .
          git add *.png
          git commit -m "Снимки интерфейса, сборка ${{ github.run_id }}"
          git push -f origin screenshots
